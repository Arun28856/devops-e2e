apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-e2e
spec:
  replicas: 3
  selector:
    matchLabels:
      app: devops-e2e
  template:
    metadata:
      labels:
        app: devops-e2e
    spec:
      containers:
      - name: devops-e2e
        image: <DOCKERHUB_USERNAME>/devops-e2e:latest
        ports:
        - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: devops-e2e-svc
spec:
  type: NodePort
  selector:
    app: devops-e2e
  ports:
  - port: 3000
    targetPort: 3000
    nodePort: 30080